# =============================================
# main への push → テスト → イメージを GHCR に push → Compute Engine に SSH でデプロイ
#
# 必要な GitHub Secrets（Settings → Secrets and variables → Actions）
#   DEPLOY_HOST      : サーバーの固定IP（terraform output static_ip）
#   DEPLOY_USER      : サーバーのログインユーザー（terraform の ssh_user。既定 deploy）
#   DEPLOY_SSH_KEY   : Terraform に登録した公開鍵に対応する秘密鍵（ed25519 の中身）
#   GHCR_PULL_TOKEN  : サーバーがイメージを取得するための PAT（read:packages）。
#                      リポジトリが Public なら不要
# =============================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP_DIR: /opt/dayservice
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements.txt
      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # compose / Caddyfile / backup.sh をサーバーに同期（.env はサーバー側で管理・上書きしない）
      - name: Sync deploy files
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh \
            "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.APP_DIR }}/"

      - name: Pull image, migrate, restart
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "APP_IMAGE='$APP_IMAGE' GHCR_USER='$GHCR_USER' GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/dayservice
            test -f .env || { echo "ERROR: /opt/dayservice/.env がありません。deploy/.env.production.example を元に作成してください"; exit 1; }
            chmod +x backup.sh

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # デプロイしたイメージを .env に固定（手動で docker compose up しても同じイメージが使われる）
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s#^APP_IMAGE=.*#APP_IMAGE=$APP_IMAGE#" .env
            else
              printf '\nAPP_IMAGE=%s\n' "$APP_IMAGE" >> .env
            fi

            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker compose exec -T app python manage.py migrate --noinput
            docker image prune -f >/dev/null
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${{ secrets.DEPLOY_HOST }}/healthz/" || true)
            case "$code" in 200|301|308) echo "healthy ($code)"; exit 0;; esac
            echo "waiting... ($code)"; sleep 5
          done
          echo "health check failed"; exit 1
