# =============================================
# 介護施設のデモ事業所（2026-11-05 の相談：病院併設の介護老人保健施設・通所リハ・居宅介護支援・デイサービスを運営する法人向けの試用）を
# AWS 開発環境のサーバー（st-michinotedemo・コト／やすらぎの森の開発環境と同じサーバー）へデプロイ
#   https://st-kaigonote.demo.ai-labo.cloud/ → プロバイダ管理の nginx（HTTPS 終端）→ Gunicorn 0.0.0.0:8046（2026-11-05 にプロバイダ側で設定ずみ）
#   置き場所 ~/kaigonotedemo、DB kaigonotedemo（ユーザー st_ai_labo_dbuser）。venv（~/env）は開発環境と共用
#   Actions から手動で実行し、ブランチは yasuragi を選ぶ（介護施設の機能 nursing は yasuragi ブランチにある）
#   サーバー側は deploy/venv-deploy.sh が git checkout → pip → migrate → collectstatic → Gunicorn 再起動を行う
#   手順は docs/DEPLOY_AWS_KAIGODEMO.md
#
# GitHub Secrets：アドレス・ポート・DB 名を変えるときだけ KAIGODEMO_DOMAIN・KAIGODEMO_PORT・KAIGODEMO_DB_NAME を登録する
#   （既定は st-kaigonote.demo.ai-labo.cloud・8046・kaigonotedemo＝2026-11-05 にプロバイダが用意した値。ポート・DB 名は初回に .env を作るときだけ使う）
#   SSH は同じサーバーなので DEV_*（Deploy (dev) のもの）をそのまま使う。別にしたいときだけ KAIGODEMO_DEPLOY_* を登録する
#   KAIGODEMO_APP_DIR（既定 ~/kaigonotedemo）、KAIGODEMO_VENV（無ければ DEV_VENV、既定 ~/env）
#
# DB について：ほかの環境の DB（kaigonotekyotaku＝コト、kaigonotemidorikai＝やすらぎの森、michinotedemo＝ゆあーず・オウルの検証）を
#   取り違えて入れたときは配備を止める（ブランチの違うアプリが同じ DB に migrate すると片方が動かなくなる）
#
# 初回：サーバーに ~/kaigonotedemo/.env が無ければ deploy/.env.kaigodemo-aws.example から作る。
#   SECRET_KEY はサーバー上で生成し、DB_PASSWORD・ANTHROPIC_API_KEY・音声の設定は開発環境の ~/michinotedemo/.env から写す
#   （同じ DB ユーザー・同じサーバー。値はログに出ない）。以後の配備では .env を上書きしない
# =============================================
name: Deploy (kaigodemo)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "配備するコミット（切り戻しのときに前のコミットの番号を入れる。空なら選んだブランチの最新）"
        type: string
        default: ""

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.KAIGODEMO_APP_DIR || '~/kaigonotedemo' }}
  VENV: ${{ secrets.KAIGODEMO_VENV || secrets.DEV_VENV || '~/env' }}
  SSH_PORT: ${{ secrets.KAIGODEMO_DEPLOY_SSH_PORT || secrets.DEV_DEPLOY_SSH_PORT || '22' }}
  DOMAIN: ${{ secrets.KAIGODEMO_DOMAIN || 'st-kaigonote.demo.ai-labo.cloud' }}
  HEALTH_URL: ${{ secrets.KAIGODEMO_HEALTH_URL || format('https://{0}/healthz/', secrets.KAIGODEMO_DOMAIN || 'st-kaigonote.demo.ai-labo.cloud') }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements.txt
      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.KAIGODEMO_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}
          USER: ${{ secrets.KAIGODEMO_DEPLOY_USER || secrets.DEV_DEPLOY_USER }}
          KEY: ${{ secrets.KAIGODEMO_DEPLOY_SSH_KEY || secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "SSH の Secrets（KAIGODEMO_DEPLOY_* または DEV_DEPLOY_*）が未登録のため、配備はスキップします（docs/DEPLOY_AWS_KAIGODEMO.md 参照）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: test
    if: needs.test.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # 開発環境と venv（~/env）を共用するので、Deploy (dev)・Deploy (kyotaku)・Manage と同じ列に並べて同時に pip を動かさない
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KAIGODEMO_DEPLOY_SSH_KEY || secrets.DEV_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.KAIGODEMO_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout, prepare .env (first time only), migrate, restart gunicorn
        env:
          SHA: ${{ inputs.ref || github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          REMOTE_APP_DIR: ${{ env.APP_DIR }}
          REMOTE_VENV: ${{ env.VENV }}
          SRC_APP_DIR: ${{ secrets.DEV_APP_DIR || '~/michinotedemo' }}
          DOMAIN: ${{ env.DOMAIN }}
          PORT_NUM: ${{ secrets.KAIGODEMO_PORT || '8046' }}
          DB_NAME_NEW: ${{ secrets.KAIGODEMO_DB_NAME || 'kaigonotedemo' }}
        run: |
          # 切り戻しで入れるのはコミットの番号だけ（英数字 7〜40 字）。ほかの文字はサーバーのコマンドに渡さない
          [[ "$SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "ref はコミットの番号（7〜40 桁の英数字）で入れてください: $SHA"; exit 1; }
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+$ ]] || { echo "KAIGODEMO_DOMAIN はアドレス（英小文字・数字・. と - だけ）で入れてください"; exit 1; }
          case "$DB_NAME_NEW" in kaigonotekyotaku|kaigonotemidorikai|michinotedemo|michinoteyours|michinoteowl) echo "ERROR: KAIGODEMO_DB_NAME（$DB_NAME_NEW）はほかの環境の DB です。デモ用に別の DB を用意してください"; exit 1;; esac
          [[ "$PORT_NUM" =~ ^[0-9]{4,5}$ ]] || { echo "KAIGODEMO_PORT は 4〜5 桁の数字で入れてください"; exit 1; }
          [[ "$DB_NAME_NEW" =~ ^[a-z0-9_]+$ ]] || { echo "KAIGODEMO_DB_NAME は英小文字・数字・_ だけで入れてください"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${{ env.SSH_PORT }}" "${{ secrets.KAIGODEMO_DEPLOY_USER || secrets.DEV_DEPLOY_USER }}@${{ secrets.KAIGODEMO_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}" \
            "SHA='$SHA' REPO_URL='$REPO_URL' APP_DIR_IN='$REMOTE_APP_DIR' VENV_IN='$REMOTE_VENV' SRC_DIR_IN='$SRC_APP_DIR' DOMAIN_IN='$DOMAIN' PORT_IN='$PORT_NUM' DB_IN='$DB_NAME_NEW' bash -s" <<'REMOTE'
            set -euo pipefail
            APP_DIR=$(eval echo "$APP_DIR_IN")
            VENV=$(eval echo "$VENV_IN")
            SRC_DIR=$(eval echo "$SRC_DIR_IN")
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --quiet "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --quiet origin
            # DB の取り違えを防ぐ：ほかの環境の DB 名になっていれば止める
            DBN="$DB_IN"
            if [ -f .env ]; then DBN=$(grep -E '^DB_NAME=' .env | head -n 1 | cut -d= -f2- || true); fi
            case "$DBN" in kaigonotekyotaku|kaigonotemidorikai|michinotedemo|michinoteyours|michinoteowl)
              echo "ERROR: DB 名が $DBN（ほかの環境の DB）です。デモ事業所の配備を止めました。サーバーの .env の DB_NAME を確かめてください。"; exit 1;; esac
            # 介護施設の機能（nursing アプリ）が入っていないコミット（ゆあーず・コトのブランチなど）は出さない
            git cat-file -e "$SHA:nursing/apps.py" 2>/dev/null || { echo "ERROR: このコミットには介護施設の機能（nursing）がありません。ブランチ yasuragi を選んで実行してください"; exit 1; }
            # 配備先コミットのスクリプトと .env の雛形を先に取り出してから実行する
            git checkout --quiet "$SHA" -- deploy/venv-deploy.sh deploy/.env.kaigodemo-aws.example
            if [ ! -f .env ]; then
              echo ".env が無いので雛形から作ります（SECRET_KEY は生成。秘密の値は開発環境の .env から写す。値は表示しない）"
              cp deploy/.env.kaigodemo-aws.example .env
              chmod 600 .env
              key=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              sed -i "s#^SECRET_KEY=.*#SECRET_KEY=$key#" .env
              sed -i "s#^MEDIA_ROOT=.*#MEDIA_ROOT=$APP_DIR/media#" .env
              sed -i "s#st-kaigonote.demo.ai-labo.cloud#$DOMAIN_IN#g" .env
              sed -i "s#^PORT=.*#PORT=$PORT_IN#" .env
              sed -i "s#^DB_NAME=.*#DB_NAME=$DB_IN#" .env
              if [ -f "$SRC_DIR/.env" ]; then
                for k in DB_PASSWORD ANTHROPIC_API_KEY AI_TEXT_MODEL AI_PLAN_MODEL GOOGLE_SPEECH_API_KEY SPEECH_BACKEND WHISPER_MODEL WHISPER_THREADS WHISPER_BEAM WHISPER_COMPUTE; do
                  line=$(grep -E "^$k=." "$SRC_DIR/.env" | head -n 1 || true)
                  [ -n "$line" ] || continue
                  if grep -qE "^#?$k=" .env; then
                    # 雛形の同じ行（コメントアウト含む）を置き換える。値に # や & があっても壊れないように区切りを使わない方法で書く
                    python3 - "$k" "$line" <<'PY'
          import re, sys
          k, line = sys.argv[1], sys.argv[2]
          p = '.env'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'(?m)^#?' + re.escape(k) + r'=.*$', lambda m: line, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
                  else
                    printf '%s\n' "$line" >> .env
                  fi
                  echo "  $k: 開発環境の .env から写しました"
                done
              else
                echo "  注意: $SRC_DIR/.env が無いため DB_PASSWORD などは空です。サーバーで .env を直してください"
              fi
            fi
            APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh "$SHA"
          REMOTE

      - name: Health check (public URL)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.HEALTH_URL }}" || true)
            case "$code" in 200) echo "healthy ($code)"; exit 0;; esac
            echo "waiting... ($code)"; sleep 5
          done
          echo "health check failed"; exit 1
