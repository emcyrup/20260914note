# =============================================
# 「児童発達支援センター　オウル」AWS 共用サーバーでの管理コマンド（Actions の画面から実行する）
#   Deploy (owl) と同じ Secrets（OWL_*。無ければ YOURS_* を使う）で SSH し、~/michinoteowl の manage.py を実行する
#   - create_facility : 事業所「児童発達支援センター　オウル」と管理者を作る（--preset ryoiku ＋ 送迎・配車と 5領域アセスメントを使う。サンプルデータも入れられる）
#   - set_password    : 管理者（職員）のパスワードを設定する
#   - seed_demo       : サンプルデータを入れる／入れ直す（--reset）
#   - seed_demo_reset : サンプルデータを消す（実データを入れる前に）
#   - list            : 事業所の一覧を表示する
#   - delete_facility : 利用者・予約の無い事業所を、職員アカウント・設定ごと消す（facility_id）
#   - error_log       : サーバーのエラーログの末尾（技術的な行だけ。日本語と長い数字は伏せる）を表示する
#   - enable_features : 送迎・配車・5領域アセスメント・アンケート（自己評価）・毎日の運営を使う設定にする（facility_id）
#   - set_media_root  : .env の MEDIA_ROOT を ~/michinoteowl/media に直して Gunicorn を再起動する（写真・書類が 500 になるとき）
#
# パスワードは入力欄（admin_password）に入れる。ログには出ない（マスクし、サーバーへは環境変数で渡す）。
# このリポジトリは公開なので、ログに秘密の値を出さないこと。
# =============================================
name: Manage (owl)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する作業"
        type: choice
        required: true
        default: list
        options: [create_facility, set_password, seed_demo, seed_demo_reset, list, delete_facility, error_log, set_media_root, enable_features]
      facility_name:
        description: "事業所名（create_facility）"
        type: string
        default: "児童発達支援センター　オウル"
      admin_username:
        description: "管理者のユーザー名（create_facility・set_password）"
        type: string
        default: owl
      admin_password:
        description: "パスワード（create_facility・set_password。空なら create_facility はランダムな仮のパスワードにし、あとで set_password で設定する）"
        type: string
        default: ""
      with_demo:
        description: "サンプルデータも入れる（create_facility）"
        type: boolean
        default: false
      facility_id:
        description: "施設 ID（seed_demo・seed_demo_reset。空なら事業所が1つのときだけ自動）"
        type: string
        default: ""
      copy_from:
        description: "設定を写す元の施設 ID（create_facility。同じ DB の中の事業所だけ。通常は空）"
        type: string
        default: ""

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.OWL_APP_DIR || '~/michinoteowl' }}
  VENV: ${{ secrets.OWL_VENV || secrets.YOURS_VENV || '~/env' }}
  SSH_PORT: ${{ secrets.OWL_DEPLOY_SSH_PORT || secrets.YOURS_DEPLOY_SSH_PORT || '22' }}

jobs:
  manage:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-yours
      cancel-in-progress: false
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.OWL_DEPLOY_HOST || secrets.YOURS_DEPLOY_HOST }}
          USER: ${{ secrets.OWL_DEPLOY_USER || secrets.YOURS_DEPLOY_USER }}
          KEY: ${{ secrets.OWL_DEPLOY_SSH_KEY || secrets.YOURS_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "OWL_DEPLOY_HOST（または YOURS_DEPLOY_HOST）などの SSH の Secrets が未登録です（docs/DEPLOY_AWS_OWL.md 6）"; exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OWL_DEPLOY_SSH_KEY || secrets.YOURS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.OWL_DEPLOY_HOST || secrets.YOURS_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run manage.py on the server
        env:
          TASK: ${{ inputs.task }}
          FACILITY_NAME: ${{ inputs.facility_name }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          WITH_DEMO: ${{ inputs.with_demo }}
          FACILITY_ID: ${{ inputs.facility_id }}
          COPY_FROM: ${{ inputs.copy_from }}
          REMOTE_APP_DIR: ${{ env.APP_DIR }}
          REMOTE_VENV: ${{ env.VENV }}
        run: |
          # パスワードはログに出さない（入力があればマスク。無ければランダムな仮の値。ログには出ない）
          if [ -n "$ADMIN_PASSWORD" ]; then
            echo "::add-mask::$ADMIN_PASSWORD"
          else
            ADMIN_PASSWORD=$(openssl rand -base64 24)
            echo "::add-mask::$ADMIN_PASSWORD"
          fi
          # 秘密の値はコマンド行に出さず、ssh の標準入力（スクリプトの先頭）で渡す
          {
            printf 'TASK=%q\nFACILITY_NAME=%q\nADMIN_USERNAME=%q\nADMIN_PASSWORD=%q\nWITH_DEMO=%q\nFACILITY_ID=%q\nCOPY_FROM=%q\nAPP_DIR_IN=%q\nVENV_IN=%q\n' \
              "$TASK" "$FACILITY_NAME" "$ADMIN_USERNAME" "$ADMIN_PASSWORD" "$WITH_DEMO" "$FACILITY_ID" "$COPY_FROM" "$REMOTE_APP_DIR" "$REMOTE_VENV"
            cat <<'REMOTE'
            set -euo pipefail
            export ADMIN_USERNAME ADMIN_PASSWORD
            APP_DIR=$(eval echo "$APP_DIR_IN"); VENV=$(eval echo "$VENV_IN")
            # shellcheck disable=SC1091
            source "$VENV/bin/activate"
            cd "$APP_DIR"
            test -f .env || { echo "ERROR: $APP_DIR/.env がありません"; exit 1; }
            set_password() {
              # パスワードは引数に出さず、環境変数から読む
              python manage.py shell -c "import os; from accounts.models import StaffAccount; u = StaffAccount.objects.get(username=os.environ['ADMIN_USERNAME']); u.set_password(os.environ['ADMIN_PASSWORD']); u.save(update_fields=['password']); print('パスワードを設定しました:', u.username)"
            }
            case "$TASK" in
              create_facility)
                args=(create_facility "$FACILITY_NAME" --admin "$ADMIN_USERNAME" --password "$(openssl rand -base64 18)" --preset ryoiku)
                [ -n "$COPY_FROM" ] && args+=(--copy-settings-from "$COPY_FROM")
                python manage.py "${args[@]}"
                set_password
                # オウルは送迎・配車と 5領域アセスメントを使う（施設設定 → 使う機能 と同じ）。サンプルデータはそのあとで入れる（送迎・5領域の見本も入る）
                # shell は「N objects imported automatically」を出すので -v 0 にし、最後の行だけを施設 ID として受け取る
                fid=$(FACILITY_NAME="$FACILITY_NAME" python manage.py shell -v 0 -c "import os; from facilities.models import Facility; f = Facility.objects.filter(name=os.environ['FACILITY_NAME']).order_by('-pk').first(); f.use_transport = True; f.use_dev_assessment = True; f.use_survey = True; f.use_daily_ops = True; f.save(update_fields=['use_transport', 'use_dev_assessment', 'use_survey', 'use_daily_ops']); print(f.pk)" | tail -n 1)
                echo "送迎・配車・5領域アセスメント・アンケート（自己評価）・毎日の運営を使う設定にしました: 施設 ID $fid"
                [ "$WITH_DEMO" = "true" ] && python manage.py seed_demo --facility "$fid"
                ;;
              set_password)
                set_password ;;
              seed_demo)
                args=(seed_demo --reset); [ -n "$FACILITY_ID" ] && args+=(--facility "$FACILITY_ID")
                python manage.py "${args[@]}" ;;
              seed_demo_reset)
                FACILITY_ID="$FACILITY_ID" python manage.py shell -c "import os, sys; from facilities.models import Facility; from facilities.management.commands.seed_demo import Command; fid = os.environ.get('FACILITY_ID') or ''; qs = Facility.objects.filter(pk=fid) if fid else Facility.objects.all(); qs.count() == 1 or sys.exit('施設を1つに絞ってください（facility_id）: ' + ', '.join(f'{f.pk}:{f.name}' for f in Facility.objects.all())); f = qs.get(); print('サンプルデータを消します:', f.pk, f.name); Command()._reset(f)" ;;
              list)
                python manage.py shell -c "from facilities.models import Facility; [print(f.pk, f.name, '| 型:', f.layout, '| 予約:', f.use_reservation, '| 療育記録:', f.use_therapy_record, '| お試しAI:', f.trial_ai_used, '/', f.trial_ai_limit) for f in Facility.objects.order_by('pk')] or print('事業所はまだありません')"
                python manage.py shell -c "from accounts.models import StaffAccount; [print(' 職員:', u.username, '|', u.facility_id, '|', u.get_role_display()) for u in StaffAccount.objects.order_by('pk')]" ;;
              enable_features)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください"; exit 1; }
                FACILITY_ID="$FACILITY_ID" python manage.py shell -v 0 -c "import os; from facilities.models import Facility; f = Facility.objects.get(pk=os.environ['FACILITY_ID']); f.use_transport = f.use_dev_assessment = f.use_survey = f.use_daily_ops = True; f.save(update_fields=['use_transport', 'use_dev_assessment', 'use_survey', 'use_daily_ops']); print('送迎・配車・5領域アセスメント・アンケート（自己評価）・毎日の運営を使う設定にしました:', f.pk, f.name)" ;;
              delete_facility)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください"; exit 1; }
                python manage.py delete_facility "$FACILITY_ID" --yes ;;
              error_log)
                # 公開リポジトリのログに出るので、日本語（利用者名など）と 6 桁以上の数字は伏せ、技術的な行だけにする
                for f in logs/error.log logs/gunicorn.out; do
                  echo "== $f（直近 120 行のうち Traceback・File・Error の行） =="
                  tail -n 400 "$f" 2>/dev/null | grep -E "Traceback|^  File |Error|Exception|Warning|\[[0-9]+\] \[(ERROR|CRITICAL|WARNING)\]" | tail -n 120 \
                    | LC_ALL=C sed -E 's/[^\x00-\x7F]/*/g; s/[0-9]{6,}/#/g; s/\*{4,}/***/g' || echo "(無し)"
                done
                echo "== 空き容量 =="; df -h "$APP_DIR" /tmp 2>/dev/null | tail -n 2; du -sh media 2>/dev/null ;;
              set_media_root)
                target="$HOME/michinoteowl/media"
                mkdir -p "$target"
                if grep -q '^MEDIA_ROOT=' .env; then sed -i "s#^MEDIA_ROOT=.*#MEDIA_ROOT=$target#" .env; else echo "MEDIA_ROOT=$target" >> .env; fi
                echo "MEDIA_ROOT を $target にしました"
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --restart ;;
              *) echo "unknown task: $TASK"; exit 1 ;;
            esac
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -p "${{ env.SSH_PORT }}" "${{ secrets.OWL_DEPLOY_USER || secrets.YOURS_DEPLOY_USER }}@${{ secrets.OWL_DEPLOY_HOST || secrets.YOURS_DEPLOY_HOST }}" bash -s
