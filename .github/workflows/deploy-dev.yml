# =============================================
# 開発環境（AWS・外部 nginx/PostgreSQL の共用サーバー）へのデプロイ
#   develop への push、または Actions から手動実行（任意のブランチを選べる）
#
# 必要な GitHub Secrets
#   DEV_DEPLOY_HOST     : サーバーのホスト名または IP（SSH 接続先）
#   DEV_DEPLOY_USER     : SSH ユーザー（docker を実行できること。既定 deploy）
#   DEV_DEPLOY_SSH_KEY  : そのユーザーの秘密鍵（ed25519 の中身）
#   DEV_DEPLOY_SSH_PORT : SSH ポート（任意。既定 22）
#   DEV_APP_DIR         : サーバー上の配置先（任意。既定 /opt/michinotedemo）
#   DEV_HEALTH_URL      : 配備後の確認 URL（任意。既定 https://st-michinotedemo.ai-labo.cloud/healthz/）
#   GHCR_PULL_TOKEN     : リポジトリが Private のときだけ（read:packages）
# =============================================
name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP_DIR: ${{ secrets.DEV_APP_DIR || '/opt/michinotedemo' }}
  DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER || 'deploy' }}
  SSH_PORT: ${{ secrets.DEV_DEPLOY_SSH_PORT || '22' }}
  HEALTH_URL: ${{ secrets.DEV_HEALTH_URL || 'https://st-michinotedemo.ai-labo.cloud/healthz/' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements.txt
      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.DEV_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # 外部 nginx/PostgreSQL 用の compose を docker-compose.yml の名前で同期（.env はサーバー側で管理・上書きしない）
      - name: Sync deploy files
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }}" \
            deploy/docker-compose.external.yml \
            "${{ env.DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }}:${{ env.APP_DIR }}/docker-compose.yml"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }}" \
            deploy/backup-external.sh deploy/nginx.example.conf \
            "${{ env.DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }}:${{ env.APP_DIR }}/"

      - name: Pull image, migrate, restart
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REMOTE_APP_DIR: ${{ env.APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ env.SSH_PORT }}" "${{ env.DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }}" \
            "APP_IMAGE='$APP_IMAGE' GHCR_USER='$GHCR_USER' GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' APP_DIR='$REMOTE_APP_DIR' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "$APP_DIR"
            test -f .env || { echo "ERROR: $APP_DIR/.env がありません。deploy/.env.dev-aws.example を元に作成してください"; exit 1; }
            mkdir -p media backups
            chmod +x backup-external.sh || true

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s#^APP_IMAGE=.*#APP_IMAGE=$APP_IMAGE#" .env
            else
              printf '\nAPP_IMAGE=%s\n' "$APP_IMAGE" >> .env
            fi

            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker compose exec -T app python manage.py migrate --noinput
            docker image prune -f >/dev/null
          REMOTE

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.HEALTH_URL }}" || true)
            case "$code" in 200) echo "healthy ($code)"; exit 0;; esac
            echo "waiting... ($code)"; sleep 5
          done
          echo "health check failed"; exit 1
