# =============================================
# 開発環境（AWS 共用サーバー：sudo なし・Docker なし・venv＋Gunicorn）へのデプロイ
#   develop への push、または Actions から手動実行（任意のブランチを選べる）
#   サーバー側は deploy/venv-deploy.sh が git checkout → pip → migrate → collectstatic → Gunicorn 再起動を行う
#
# 必要な GitHub Secrets
#   DEV_DEPLOY_HOST     : サーバーの IP（例 15.168.83.1）
#   DEV_DEPLOY_USER     : SSH ユーザー（プロバイダ配布のアカウント。例 3piece_user4）
#   DEV_DEPLOY_SSH_KEY  : 配布された秘密鍵（.pem）の中身
#   DEV_DEPLOY_SSH_PORT : SSH ポート（任意。既定 22）
#   DEV_APP_DIR         : サーバー上の clone 先（任意。既定 ~/michinotedemo）
#   DEV_HEALTH_URL      : 配備後の確認 URL（任意。既定 https://st-michinotedemo.ai-labo.cloud/healthz/）
# =============================================
name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.DEV_APP_DIR || '~/michinotedemo' }}
  SSH_PORT: ${{ secrets.DEV_DEPLOY_SSH_PORT || '22' }}
  HEALTH_URL: ${{ secrets.DEV_HEALTH_URL || 'https://st-michinotedemo.ai-labo.cloud/healthz/' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements.txt
      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.DEV_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout, migrate, restart gunicorn
        env:
          SHA: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          REMOTE_APP_DIR: ${{ env.APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ env.SSH_PORT }}" "${{ secrets.DEV_DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }}" \
            "SHA='$SHA' REPO_URL='$REPO_URL' APP_DIR_IN='$REMOTE_APP_DIR' bash -s" <<'REMOTE'
            set -euo pipefail
            APP_DIR=$(eval echo "$APP_DIR_IN")
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --quiet "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --quiet origin
            # 配備先コミットのスクリプトを先に取り出してから実行する
            git checkout --quiet "$SHA" -- deploy/venv-deploy.sh
            APP_DIR="$APP_DIR" bash deploy/venv-deploy.sh "$SHA"
          REMOTE

      - name: Health check (public URL)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.HEALTH_URL }}" || true)
            case "$code" in 200) echo "healthy ($code)"; exit 0;; esac
            echo "waiting... ($code)"; sleep 5
          done
          echo "health check failed"; exit 1
