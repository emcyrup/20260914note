# =============================================
# 「シンプル」用の別サーバー（計画書中心の画面）へのデプロイ
#   ブランチ simple への push、または Actions から手動実行（任意のブランチを選べる）
#   サーバー側の手順は deploy/venv-deploy.sh（開発環境と同じ：git checkout → pip → migrate → collectstatic → Gunicorn 再起動）
#   手順の全体は docs/SIMPLE_SERVER.md
#
# 必要な GitHub Secrets（開発環境の DEV_* とは別に登録する）
#   SIMPLE_DEPLOY_HOST     : サーバーの IP またはホスト名
#   SIMPLE_DEPLOY_USER     : SSH ユーザー
#   SIMPLE_DEPLOY_SSH_KEY  : 秘密鍵の中身
#   SIMPLE_DEPLOY_SSH_PORT : SSH ポート（任意。既定 22）
#   SIMPLE_APP_DIR         : サーバー上の clone 先（任意。既定 ~/simple）
#   SIMPLE_VENV            : venv の場所（任意。既定 ~/env）
#   SIMPLE_HEALTH_URL      : 配備後の確認 URL（例 https://simple.example.jp/healthz/）
# Secrets が未登録のうちは、テストだけ実行して配備はスキップする（失敗にしない）
# =============================================
name: Deploy (simple)

on:
  push:
    branches: [simple]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.SIMPLE_APP_DIR || '~/simple' }}
  VENV_DIR: ${{ secrets.SIMPLE_VENV || '~/env' }}
  SSH_PORT: ${{ secrets.SIMPLE_DEPLOY_SSH_PORT || '22' }}
  HEALTH_URL: ${{ secrets.SIMPLE_HEALTH_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements.txt
      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-simple
      cancel-in-progress: false
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.SIMPLE_DEPLOY_HOST }}
          KEY: ${{ secrets.SIMPLE_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "SIMPLE_DEPLOY_HOST / SIMPLE_DEPLOY_SSH_KEY が未登録のため、配備はスキップします（docs/SIMPLE_SERVER.md 参照）"
            echo "READY=false" >> "$GITHUB_ENV"
          else
            echo "READY=true" >> "$GITHUB_ENV"
          fi

      - name: Set up SSH
        if: env.READY == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SIMPLE_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.SIMPLE_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout, migrate, restart gunicorn
        if: env.READY == 'true'
        env:
          SHA: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          REMOTE_APP_DIR: ${{ env.APP_DIR }}
          REMOTE_VENV: ${{ env.VENV_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ env.SSH_PORT }}" "${{ secrets.SIMPLE_DEPLOY_USER }}@${{ secrets.SIMPLE_DEPLOY_HOST }}" \
            "SHA='$SHA' REPO_URL='$REPO_URL' APP_DIR_IN='$REMOTE_APP_DIR' VENV_IN='$REMOTE_VENV' bash -s" <<'REMOTE'
            set -euo pipefail
            APP_DIR=$(eval echo "$APP_DIR_IN")
            VENV=$(eval echo "$VENV_IN")
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --quiet "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --quiet origin
            git checkout --quiet "$SHA" -- deploy/venv-deploy.sh
            APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh "$SHA"
          REMOTE

      - name: Health check (public URL)
        if: env.READY == 'true' && env.HEALTH_URL != ''
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.HEALTH_URL }}" || true)
            case "$code" in 200) echo "healthy ($code)"; exit 0;; esac
            echo "waiting... ($code)"; sleep 5
          done
          echo "health check failed"; exit 1
