# =============================================
# 介護施設「やすらぎの森」（法人：みどり会）を AWS 開発環境のサーバー（st-michinotedemo・コトの開発環境と同じサーバー）へデプロイ
#   https://st-kaigonote.midorikai.ai-labo.cloud/ → プロバイダ管理の nginx（HTTPS 終端）→ Gunicorn 0.0.0.0:8045（2026-11-02 にプロバイダ側で設定ずみ）
#   置き場所 ~/kaigonotemidorikai、DB kaigonotemidorikai（ユーザー st_ai_labo_dbuser）。venv（~/env）は開発環境と共用
#   Actions から手動で実行し、ブランチは yasuragi を選ぶ（やすらぎの森の機能 nursing は yasuragi ブランチにある）
#   サーバー側は deploy/venv-deploy.sh が git checkout → pip → migrate → collectstatic → Gunicorn 再起動を行う
#   手順は docs/DEPLOY_AWS_YASURAGI.md
#
# GitHub Secrets：同じサーバーなので DEV_*（Deploy (dev) のもの）をそのまま使う。別にしたいときだけ YASURAGI_* を登録する
#   YASURAGI_DEPLOY_HOST / YASURAGI_DEPLOY_USER / YASURAGI_DEPLOY_SSH_KEY / YASURAGI_DEPLOY_SSH_PORT（無ければ DEV_*）
#   YASURAGI_APP_DIR（既定 ~/kaigonotemidorikai）、YASURAGI_VENV（無ければ DEV_VENV、既定 ~/env）
#   YASURAGI_DOMAIN（既定 st-kaigonote.midorikai.ai-labo.cloud）・YASURAGI_PORT（既定 8045）・YASURAGI_DB_NAME（既定 kaigonotemidorikai）
#     （ポート・DB 名は初回に .env を作るときだけ使う）
#
# DB について（2026-11-02）：やすらぎの森の DB は kaigonotemidorikai（プロバイダが作成）。コトの開発環境の DB（kaigonotekyotaku）とは別。
#   ブランチの違うアプリが同じ DB に migrate すると片方が動かなくなるおそれがあるので、
#   取り違えて DB 名が kaigonotekyotaku になっているときは、入力の「コトの開発環境と DB を共用する」に印が無ければ配備を止める
#
# 初回：サーバーに ~/kaigonotemidorikai/.env が無ければ deploy/.env.yasuragi-aws.example から作る。
#   SECRET_KEY はサーバー上で生成し、DB_PASSWORD・ANTHROPIC_API_KEY・音声の設定は開発環境の ~/michinotedemo/.env から写す
#   （同じ DB ユーザー・同じサーバー。値はログに出ない）。以後の配備では .env を上書きしない
# =============================================
name: Deploy (yasuragi)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "配備するコミット（切り戻しのときに前のコミットの番号を入れる。空なら選んだブランチの最新）"
        type: string
        default: ""
      share_db_with_koto:
        description: "コトの開発環境と DB（kaigonotekyotaku）を共用する（プロバイダに確かめてから印を付ける）"
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.YASURAGI_APP_DIR || '~/kaigonotemidorikai' }}
  VENV: ${{ secrets.YASURAGI_VENV || secrets.DEV_VENV || '~/env' }}
  SSH_PORT: ${{ secrets.YASURAGI_DEPLOY_SSH_PORT || secrets.DEV_DEPLOY_SSH_PORT || '22' }}
  DOMAIN: ${{ secrets.YASURAGI_DOMAIN || 'st-kaigonote.midorikai.ai-labo.cloud' }}
  HEALTH_URL: ${{ secrets.YASURAGI_HEALTH_URL || format('https://{0}/healthz/', secrets.YASURAGI_DOMAIN || 'st-kaigonote.midorikai.ai-labo.cloud') }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: |
          # パッケージの配布元に一時的につながらないことがある（2026-11-11 DNS の失敗）。3 回まで試し、
          # それでも入らなければ、ランナーにもともと入っている PDF 用のライブラリで続ける（無ければ止める）
          libs="libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0"
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $libs && exit 0
            echo "apt に失敗（$i 回目）。20 秒後にもう一度"; sleep 20
          done
          ldconfig -p > "$RUNNER_TEMP/libs.txt"
          for l in libpango-1.0.so.0 libpangoft2-1.0.so.0 libharfbuzz-subset.so.0; do
            grep -q "$l" "$RUNNER_TEMP/libs.txt" || { echo "ERROR: $l がありません（apt にもつながりません）"; exit 1; }
          done
          echo "apt にはつながりませんが、必要なライブラリはランナーに入っているので続けます"
      - run: pip install -r requirements.txt
      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.YASURAGI_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}
          USER: ${{ secrets.YASURAGI_DEPLOY_USER || secrets.DEV_DEPLOY_USER }}
          KEY: ${{ secrets.YASURAGI_DEPLOY_SSH_KEY || secrets.DEV_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "SSH の Secrets（YASURAGI_DEPLOY_* または DEV_DEPLOY_*）が未登録のため、配備はスキップします（docs/DEPLOY_AWS_YASURAGI.md 参照）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: test
    if: needs.test.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # 開発環境と venv（~/env）を共用するので、Deploy (dev)・Deploy (kyotaku)・Manage と同じ列に並べて同時に pip を動かさない
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.YASURAGI_DEPLOY_SSH_KEY || secrets.DEV_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" -H "${{ secrets.YASURAGI_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout, prepare .env (first time only), migrate, restart gunicorn
        env:
          SHA: ${{ inputs.ref || github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          REMOTE_APP_DIR: ${{ env.APP_DIR }}
          REMOTE_VENV: ${{ env.VENV }}
          SRC_APP_DIR: ${{ secrets.DEV_APP_DIR || '~/michinotedemo' }}
          DOMAIN: ${{ env.DOMAIN }}
          PORT_NUM: ${{ secrets.YASURAGI_PORT || '8045' }}
          DB_NAME_NEW: ${{ secrets.YASURAGI_DB_NAME || 'kaigonotemidorikai' }}
          SHARE_DB: ${{ inputs.share_db_with_koto }}
        run: |
          # 切り戻しで入れるのはコミットの番号だけ（英数字 7〜40 字）。ほかの文字はサーバーのコマンドに渡さない
          [[ "$SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "ref はコミットの番号（7〜40 桁の英数字）で入れてください: $SHA"; exit 1; }
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+$ ]] || { echo "YASURAGI_DOMAIN はアドレス（英小文字・数字・. と - だけ）で入れてください"; exit 1; }
          [[ "$PORT_NUM" =~ ^[0-9]{4,5}$ ]] || { echo "YASURAGI_PORT は 4〜5 桁の数字で入れてください"; exit 1; }
          [[ "$DB_NAME_NEW" =~ ^[a-z0-9_]+$ ]] || { echo "YASURAGI_DB_NAME は英小文字・数字・_ だけで入れてください"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${{ env.SSH_PORT }}" "${{ secrets.YASURAGI_DEPLOY_USER || secrets.DEV_DEPLOY_USER }}@${{ secrets.YASURAGI_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}" \
            "SHA='$SHA' REPO_URL='$REPO_URL' APP_DIR_IN='$REMOTE_APP_DIR' VENV_IN='$REMOTE_VENV' SRC_DIR_IN='$SRC_APP_DIR' DOMAIN_IN='$DOMAIN' PORT_IN='$PORT_NUM' DB_IN='$DB_NAME_NEW' SHARE_IN='$SHARE_DB' bash -s" <<'REMOTE'
            set -euo pipefail
            APP_DIR=$(eval echo "$APP_DIR_IN")
            VENV=$(eval echo "$VENV_IN")
            SRC_DIR=$(eval echo "$SRC_DIR_IN")
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --quiet "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --quiet origin
            # DB の取り違えを防ぐ：コトの開発環境の DB（kaigonotekyotaku）を使うときは、共用すると決めたときだけ進む
            DBN="$DB_IN"
            if [ -f .env ]; then DBN=$(grep -E '^DB_NAME=' .env | head -n 1 | cut -d= -f2- || true); fi
            if [ "$DBN" = "kaigonotekyotaku" ] && [ "$SHARE_IN" != "true" ]; then
              echo "ERROR: DB 名が kaigonotekyotaku（コトの開発環境と同じ DB）です。やすらぎの森の配備を止めました。"
              echo "  別の DB を用意したときは Secrets の YASURAGI_DB_NAME にその名前を入れて再実行（初回の .env 作成前なら反映される）。"
              echo "  共用でよいとプロバイダに確かめたときは、入力の「コトの開発環境と DB を共用する」に印を付けて再実行。"
              exit 1
            fi
            # 介護施設の機能（nursing アプリ）が入っていないコミット（ゆあーず・コトのブランチなど）は出さない
            git cat-file -e "$SHA:nursing/apps.py" 2>/dev/null || { echo "ERROR: このコミットには介護施設の機能（nursing）がありません。ブランチ yasuragi を選んで実行してください"; exit 1; }
            # 配備先コミットのスクリプトと .env の雛形を先に取り出してから実行する
            git checkout --quiet "$SHA" -- deploy/venv-deploy.sh deploy/.env.yasuragi-aws.example
            if [ ! -f .env ]; then
              echo ".env が無いので雛形から作ります（SECRET_KEY は生成。秘密の値は開発環境の .env から写す。値は表示しない）"
              cp deploy/.env.yasuragi-aws.example .env
              chmod 600 .env
              key=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              sed -i "s#^SECRET_KEY=.*#SECRET_KEY=$key#" .env
              sed -i "s#^MEDIA_ROOT=.*#MEDIA_ROOT=$APP_DIR/media#" .env
              sed -i "s#st-kaigonote.midorikai.ai-labo.cloud#$DOMAIN_IN#g" .env
              sed -i "s#^PORT=.*#PORT=$PORT_IN#" .env
              sed -i "s#^DB_NAME=.*#DB_NAME=$DB_IN#" .env
              if [ -f "$SRC_DIR/.env" ]; then
                for k in DB_PASSWORD ANTHROPIC_API_KEY AI_TEXT_MODEL AI_PLAN_MODEL GOOGLE_SPEECH_API_KEY SPEECH_BACKEND WHISPER_MODEL WHISPER_THREADS WHISPER_BEAM WHISPER_COMPUTE; do
                  line=$(grep -E "^$k=." "$SRC_DIR/.env" | head -n 1 || true)
                  [ -n "$line" ] || continue
                  if grep -qE "^#?$k=" .env; then
                    # 雛形の同じ行（コメントアウト含む）を置き換える。値に # や & があっても壊れないように区切りを使わない方法で書く
                    python3 - "$k" "$line" <<'PY'
          import re, sys
          k, line = sys.argv[1], sys.argv[2]
          p = '.env'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'(?m)^#?' + re.escape(k) + r'=.*$', lambda m: line, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
                  else
                    printf '%s\n' "$line" >> .env
                  fi
                  echo "  $k: 開発環境の .env から写しました"
                done
              else
                echo "  注意: $SRC_DIR/.env が無いため DB_PASSWORD などは空です。サーバーで .env を直してください"
              fi
            fi
            APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh "$SHA"
          REMOTE

      - name: Health check (public URL)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ env.HEALTH_URL }}" || true)
            case "$code" in 200) echo "healthy ($code)"; exit 0;; esac
            echo "waiting... ($code)"; sleep 5
          done
          echo "health check failed"; exit 1
