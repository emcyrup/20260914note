# Pull Request と main 以外への push でテストを回す（デプロイはしない）
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # WeasyPrint が import 時に必要とする描画ライブラリ
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput

  # 本番イメージがビルドできることを確認する（レジストリには push しない）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: dayservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm -e SECRET_KEY=ci -e DEBUG=False -e DJANGO_ALLOWED_HOSTS=localhost \
            dayservice:ci python manage.py check --deploy --fail-level ERROR
          docker run --rm -e SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost \
            dayservice:ci python -c "import weasyprint, anthropic, gunicorn; print('imports ok')"
