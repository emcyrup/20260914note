# Pull Request と main 以外への push でテストを回す（デプロイはしない）
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # WeasyPrint が import 時に必要とする描画ライブラリ
      - name: Install system libraries
        run: |
          # パッケージの配布元に一時的につながらないことがある（2026-11-11 DNS の失敗）。3 回まで試し、
          # それでも入らなければ、ランナーにもともと入っている PDF 用のライブラリで続ける（無ければ止める）
          libs="libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0"
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $libs && exit 0
            echo "apt に失敗（$i 回目）。20 秒後にもう一度"; sleep 20
            if [ "$i" = 1 ]; then
              # ランナーの既定の配布元（azure.archive.ubuntu.com）が引けないことがある → Ubuntu の本家の配布元に切り替える
              echo "配布元を archive.ubuntu.com・security.ubuntu.com に切り替えます"
              for src in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
                [ -f "$src" ] && sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' \
                  -e 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$src"
              done
            fi
          done
          ldconfig -p > "$RUNNER_TEMP/libs.txt"
          for l in libpango-1.0.so.0 libpangoft2-1.0.so.0 libharfbuzz-subset.so.0; do
            grep -q "$l" "$RUNNER_TEMP/libs.txt" || { echo "ERROR: $l がありません（apt にもつながりません）"; exit 1; }
          done
          echo "apt にはつながりませんが、必要なライブラリはランナーに入っているので続けます"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django check & tests
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          python manage.py check
          python manage.py test --noinput

  # 本番イメージがビルドできることを確認する（レジストリには push しない）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: dayservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm -e SECRET_KEY=ci -e DEBUG=False -e DJANGO_ALLOWED_HOSTS=localhost \
            dayservice:ci python manage.py check --deploy --fail-level ERROR
          docker run --rm -e SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost \
            dayservice:ci python -c "import weasyprint, anthropic, gunicorn; print('imports ok')"
