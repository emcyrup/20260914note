# =============================================
# nginx の server ブロック例（HTTPS 終端は既存設定のまま。location と proxy 設定を合わせる）
#   https://st-michinotedemo.ai-labo.cloud/ → 127.0.0.1:8029（app コンテナ）
# =============================================
server {
    listen 443 ssl http2;
    server_name st-michinotedemo.ai-labo.cloud;

    # ssl_certificate / ssl_certificate_key は既存の設定のまま

    # 写真・紙の日誌の取り込み（1回に最大20枚）に備えて上限を広げる
    client_max_body_size 100m;

    # AI 生成・PDF 生成は数十秒かかることがある
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # アップロードした写真などは nginx が直接配信する（.env の SERVE_MEDIA=False にする）
    # compose の ./media を絶対パスで指定する
    location /media/ {
        alias /opt/michinotedemo/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8029;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django はこのヘッダーで HTTPS と判断する（SECURE_PROXY_SSL_HEADER）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
