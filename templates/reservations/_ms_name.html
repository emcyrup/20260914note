{% comment %}月間予定表の名前（1件の予約）。ドラッグで動かせる。cls は ms-box（1人の箱）か ms-nm（きょうだいで1枠の箱の中の名前）{% endcomment %}<a class="{{ cls }}{% if r.attendance %} {{ r.attendance }}{% endif %}{% if r.pair_names %} pair{% endif %}" draggable="true" data-res="{{ r.pk }}" data-b="{{ r.beneficiary_id|default:'' }}" data-sibs="{{ r.sibling_ids }}" data-name="{{ r.display_name }}" data-att="{{ r.attendance }}" data-date="{{ d.date|date:'Y-m-d' }}" data-hour="{{ s.hour }}" data-when="{{ d.date|date:'n/j' }} {{ s.label }}" href="{% url 'reservations:day' d.date.year d.date.month d.date.day %}" title="{{ r.display_name }} {{ r.time_label }}{% if r.attendance %}（{{ r.get_attendance_display }}）{% endif %}{% if r.pair_names %} ／組み合わせNG：{{ r.pair_names|join:'・' }} さんと同じ時間{% endif %}{% if cls == 'ms-nm' %} ／きょうだいで1枠{% endif %}">{% if r.attendance %}<span class="ms-att {{ r.attendance }}">{{ r.attendance_mark }}</span>{% endif %}{{ r.display_name }}</a>
