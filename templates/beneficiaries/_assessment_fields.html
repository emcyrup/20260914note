{% comment %}アセスメント・資料の入力欄（追加・直すで共通）。a が None なら追加用。prefix は id の重なりを避けるため{% endcomment %}
<div class="col-6 col-md-3">
  <label class="form-label small fw-semibold" for="asm-date-{{ prefix }}">日付</label>
  <input type="date" name="date" id="asm-date-{{ prefix }}" class="form-control form-control-sm" required
         value="{% if a %}{{ a.date|date:'Y-m-d' }}{% else %}{% now 'Y-m-d' %}{% endif %}">
</div>
<div class="col-6 col-md-3">
  <label class="form-label small fw-semibold" for="asm-kind-{{ prefix }}">種類</label>
  <select name="kind" id="asm-kind-{{ prefix }}" class="form-select form-select-sm">
    {% for value, label in assessment_kinds %}<option value="{{ value }}" {% if a and a.kind == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</div>
<div class="col-12 col-md-6">
  <label class="form-label small fw-semibold" for="asm-title-{{ prefix }}">件名</label>
  <input type="text" name="title" id="asm-title-{{ prefix }}" class="form-control form-control-sm" maxlength="100"
         value="{% if a %}{{ a.title }}{% endif %}" placeholder="例：初回アセスメント／保護者面談／新版K式の結果">
</div>
<div class="col-12">
  <div class="d-flex justify-content-between align-items-end">
    <label class="form-label small fw-semibold mb-1" for="asm-content-{{ prefix }}">内容</label>
    <button type="button" class="asm-voice btn btn-sm btn-outline-secondary mb-1" data-voice-target="asm-content-{{ prefix }}" data-voice-note="asm-note-{{ prefix }}"><i class="bi bi-mic"></i> 音声入力</button>
  </div>
  <div id="asm-note-{{ prefix }}" class="alert alert-warning small py-1 px-2 mb-1 d-none"></div>
  <textarea name="content" id="asm-content-{{ prefix }}" class="form-control form-control-sm" rows="5"
            placeholder="本人の様子・得意なこと・苦手なこと・家庭や学校の様子・保護者の希望・関係機関からの情報など">{% if a %}{{ a.content }}{% endif %}</textarea>
</div>
<div class="col-12">
  <label class="form-label small fw-semibold" for="asm-file-{{ prefix }}">書類（PDF・写真）{% if a and a.file %}<span class="fw-normal text-muted">　いまの書類：{{ a.file_name|default:'あり' }}</span>{% endif %}</label>
  <input type="file" name="file" id="asm-file-{{ prefix }}" class="form-control form-control-sm" accept="application/pdf,image/*">
  {% if a and a.file %}
  <div class="form-check mt-1"><input class="form-check-input" type="checkbox" name="remove_file" value="1" id="asm-rm-{{ prefix }}">
    <label class="form-check-label small" for="asm-rm-{{ prefix }}">いまの書類を外す</label></div>
  {% endif %}
  <div class="form-text">20MB まで。新しい書類を選ぶと、いまの書類と入れ替わります。</div>
</div>
