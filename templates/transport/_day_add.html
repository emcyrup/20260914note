{% if others %}
<form method="post" class="d-flex align-items-center gap-2">
  {% csrf_token %}<input type="hidden" name="action" value="add"><input type="hidden" name="d" value="{{ day|date:'Y-m-d' }}"><input type="hidden" name="direction" value="{{ direction }}">
  <span class="small fw-semibold">{{ dlabel }}</span>
  <select name="reservation" class="form-select form-select-sm" style="min-width:160px;">
    {% for r in others %}<option value="{{ r.pk }}">{{ r.display_name }}{% if r.start_time %}（{{ r.time_label }}）{% endif %}</option>{% endfor %}
  </select>
  <button class="btn btn-sm btn-outline-primary text-nowrap"><i class="bi bi-plus-lg me-1"></i>足す</button>
</form>
{% endif %}
