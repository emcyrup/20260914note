{% extends 'base.html' %}

{% block title %}ログイン — 放課後等デイサービス業務支援{% endblock %}

{% block content %}
  <div class="card" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4 p-md-5">

      <!-- ロゴ・タイトル -->
      <div class="text-center mb-4">
        <div class="mb-2" style="color: var(--lake); font-size: 2.5rem;">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h1 class="h4 fw-bold" style="font-family: var(--font-display); color: var(--ink);">放デイ業務支援</h1>
        <p class="text-muted small">{{ terms.staff }}専用ログイン</p>
      </div>

      <!-- エラーメッセージ -->
      {% if form.errors %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-triangle me-1"></i>
        ユーザー名またはパスワードが正しくありません。
      </div>
      {% endif %}

      <!-- ログインフォーム -->
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label for="id_username" class="form-label fw-semibold">ユーザー名</label>
          <input type="text"
                 id="id_username"
                 name="username"
                 class="form-control form-control-lg"
                 autofocus
                 autocomplete="username"
                 placeholder="ユーザー名を入力">
        </div>

        <div class="mb-4">
          <label for="id_password" class="form-label fw-semibold">パスワード</label>
          <input type="password"
                 id="id_password"
                 name="password"
                 class="form-control form-control-lg"
                 autocomplete="current-password"
                 placeholder="パスワードを入力">
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
          </button>
        </div>

        <!-- next パラメータ（ログイン後の遷移先を保持するための隠しフィールド） -->
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
      </form>

    </div>
  </div>
{% endblock %}
