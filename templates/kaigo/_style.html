<style>
  .kg-tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 2px solid var(--color-primary, #4e7d89); scrollbar-width: thin; }
  .kg-tabs a { flex: 0 0 auto; padding: 8px 14px; border-radius: 8px 8px 0 0; text-decoration: none; color: #555; background: #f1eee8; white-space: nowrap; font-size: .92rem; }
  .kg-tabs a i { margin-right: 4px; }
  .kg-tabs a.active { background: var(--color-primary, #4e7d89); color: #fff; font-weight: 700; }
  .kg-tabs a:hover:not(.active) { background: #e6e1d7; }
  .kg-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .kg-name { font-weight: 700; font-size: 1.15rem; }
  .kg-level { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 10px; background: #e7ecf6; color: #2c4a7a; margin-left: 6px; vertical-align: middle; }
  .kg-level.support { background: #e6f0ec; color: #2f5d50; }
  .kg-cat { display: inline-block; font-size: .74rem; padding: 1px 8px; border-radius: 10px; background: #eee; color: #444; white-space: nowrap; }
  .kg-cat.monitoring { background: #e6f0ec; color: #2f5d50; }
  .kg-cat.provider { background: #e7ecf6; color: #2c4a7a; }
  .kg-cat.meeting { background: #f3ecdf; color: #6b4e1f; }
  .kg-cat.family { background: #f6e7ee; color: #7a2c52; }
  .kg-log { padding: 10px 0; border-top: 1px solid var(--line, #e5e0d6); }
  .kg-log:first-child { border-top: 0; }
  .kg-log-body { white-space: pre-wrap; margin-top: 4px; }
  .kg-grid { border-collapse: collapse; font-size: .8rem; }
  .kg-grid th, .kg-grid td { border: 1px solid #d8d2c6; padding: 2px; text-align: center; }
  .kg-grid th.sun, .kg-grid td.sun { background: #fdecec; }
  .kg-grid th.sat, .kg-grid td.sat { background: #eaf1fb; }
  .kg-grid .kg-day input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
  .kg-grid .kg-meta .form-control, .kg-grid .kg-meta .form-select { padding: 1px 6px; font-size: .8rem; min-height: 0; height: auto; border-radius: 6px; }
  .kg-grid .kg-meta { text-align: left; min-width: 230px; max-width: 260px; padding: 4px; background: #faf8f4; position: sticky; left: 0; z-index: 1; }
  .kg-grid .kg-kind { font-size: .72rem; color: #666; white-space: nowrap; }
  .kg-grid tr.kg-done td.kg-day input { accent-color: #1f6a3a; }
  .kg-grid tr.kg-plan td.kg-day input { accent-color: #6b5200; }
  .kg-scroll { overflow-x: auto; }
  .kg-goal { border: 1px solid var(--line, #e5e0d6); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fff; }
  .kg-item-label { font-weight: 600; font-size: .9rem; }
</style>
<style>
  .kg-drop { border: 2px dashed #cfc8bb; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; background: rgba(255,255,255,.6); }
  .kg-drop.over { border-color: var(--color-primary, #4e7d89); background: #eef5f3; }
  .kg-drop input[type=file] { display: none; }
  .kg-drop .bi { font-size: 1.2rem; display: block; color: #6b8f8a; }
  .kg-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; display: inline-flex; align-items: center; justify-content: center; }
  .kg-thumb-pdf { background: #fbecec; color: #b3261e; font-size: 1.6rem; }
  .kg-feed .kg-entry { padding: 14px 4px 12px; border-top: 1px solid var(--line, #e5e0d6); }
  .kg-feed .kg-entry:first-child { border-top: 0; }
  .kg-entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .kg-entry-cat { font-weight: 700; font-size: 1rem; }
  .kg-entry-date { color: #555; font-size: .88rem; white-space: nowrap; }
  .kg-entry-body { white-space: pre-wrap; margin-top: 4px; line-height: 1.75; }
  .kg-entry-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; }
  .kg-month { font-weight: 700; color: #6b6458; font-size: .85rem; padding: 10px 4px 2px; border-top: 2px solid #e5e0d6; }
  .kg-group { font-weight: 700; font-size: .85rem; color: #555; padding: 8px 4px 4px; }
</style>
<style>
  .kg-more-hidden { display: none; }
  .kg-tabs { scrollbar-width: none; }
  .kg-tabs::-webkit-scrollbar { display: none; }
  @media (max-width: 576px) {
    .kg-tabs a { padding: 7px 10px; font-size: .86rem; }
    .kg-head .kg-name { font-size: 1.05rem; }
    .kg-grid .kg-meta { min-width: 150px; max-width: 160px; }
    .kg-grid .kg-meta .form-control, .kg-grid .kg-meta .form-select { font-size: .74rem; padding: 1px 4px; }
    .kg-grid .kg-wk .btn { font-size: .66rem !important; padding: 0 3px !important; }
  }
</style>
